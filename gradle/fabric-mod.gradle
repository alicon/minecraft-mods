apply plugin: 'net.fabricmc.fabric-loom-remap'
apply plugin: 'maven-publish'
apply plugin: 'com.modrinth.minotaur'

def modId = project.ext.mod_id
def archiveName = project.ext.mod_archive_name
def displayName = project.ext.mod_display_name
def modVersion = project.ext.mod_version
def modrinthProjectEnv = project.ext.modrinth_project_env
def modrinthProjectFallback = project.ext.modrinth_project_fallback
def optionalModrinthProjects = project.ext.modrinth_optional_projects
def changelogFile = rootProject.file("docs/release-notes/${project.name}/${modVersion}.md")
def supportedVersions = project.ext.has('supported_minecraft_versions') ? project.ext.supported_minecraft_versions : []
def requestedMinecraftVersion = project.findProperty('target_minecraft_version')
if (requestedMinecraftVersion && !supportedVersions.isEmpty() && !supportedVersions.contains(requestedMinecraftVersion)) {
	throw new GradleException("${project.path} does not support Minecraft ${requestedMinecraftVersion}; supported versions: ${supportedVersions.join(', ')}")
}
def activeMinecraftVersion = requestedMinecraftVersion && !supportedVersions.isEmpty()
		? requestedMinecraftVersion
		: project.minecraft_version
def legacyTarget = activeMinecraftVersion == project.legacy_minecraft_version
def activeFabricApiVersion = legacyTarget ? project.legacy_fabric_api_version : project.fabric_api_version
def activeLoaderVersion = legacyTarget ? project.legacy_loader_version : project.loader_version
def versionedSourceRoot = "src/versions/${activeMinecraftVersion}"
def releaseVersion = { target -> supportedVersions.isEmpty() ? modVersion : "${modVersion}+mc${target}" }
def publishedVersionNumber = releaseVersion(activeMinecraftVersion)
def excludedSources = ['common': 'main', 'client': 'client'].collectMany { environment, sourceSet ->
	def propertyName = "versioned_${environment}_excludes"
	def excludes = project.ext.has(propertyName) ? project.ext.get(propertyName).get(activeMinecraftVersion, []) : []
	excludes.collect { path -> project.file("src/${sourceSet}/java/${path}") }
} as Set

project.ext.active_minecraft_version = activeMinecraftVersion
project.ext.active_fabric_api_version = activeFabricApiVersion
project.ext.active_loader_version = activeLoaderVersion
project.ext.releaseTargets = (supportedVersions ?: [project.minecraft_version]).collect { target ->
	[project.name, target, modVersion, archiveName, releaseVersion(target)]
}

version = modVersion
group = project.maven_group

layout.buildDirectory = rootProject.layout.buildDirectory.dir("mods/${project.name}/${activeMinecraftVersion}")

base {
	archivesName = archiveName
}

sourceSets {
	main {
		java.srcDir "${versionedSourceRoot}/main/java"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"${modId}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

sourceSets {
	client {
		java.srcDir "${versionedSourceRoot}/client/java"
	}
}

if (project.ext.has('enable_game_tests') && project.ext.enable_game_tests) {
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "${modId}_gametest"
			enableClientGameTests = false
			eula = true
		}
	}

	sourceSets {
		gametest {
			java.setSrcDirs(["src/gametest/java", "${versionedSourceRoot}/gametest/java"])
		}
	}

	tasks.register('runGameTestServer') {
		group = 'verification'
		description = 'Runs the server-side Fabric GameTests.'
		dependsOn tasks.named('runGameTest')
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = System.getenv(modrinthProjectEnv) ?: modrinthProjectFallback
	versionNumber = publishedVersionNumber
	versionName = "${displayName} ${publishedVersionNumber} for Minecraft ${activeMinecraftVersion}"
	versionType = System.getenv("MODRINTH_VERSION_TYPE") ?: "alpha"
	uploadFile = remapJar
	gameVersions = [activeMinecraftVersion]
	loaders = ["fabric"]
	if (changelogFile.exists()) {
		changelog = changelogFile.text
	}

	dependencies {
		required.project "fabric-api"
		optionalModrinthProjects.each { optionalProject ->
			optional.project optionalProject
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${activeMinecraftVersion}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${activeLoaderVersion}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${activeFabricApiVersion}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", modVersion
	inputs.property "minecraft_dependency", "~${activeMinecraftVersion}"
	inputs.property "loader_dependency", activeLoaderVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion,
				"minecraft_dependency": "~${activeMinecraftVersion}",
				"loader_dependency": activeLoaderVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	if (!excludedSources.empty) {
		source = source.filter { file -> !excludedSources.contains(file) }
	}
	options.release = 21
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

tasks.withType(Javadoc).configureEach {
	if (!excludedSources.empty) {
		source = source.filter { file -> !excludedSources.contains(file) }
	}
	failOnError = true
	options.encoding = 'UTF-8'
	options.addStringOption('Xdoclint:reference,syntax', '-quiet')
}

tasks.named('check') {
	dependsOn tasks.named('javadoc')
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('sourcesJar') {
	if (!excludedSources.empty) {
		exclude { details -> excludedSources.contains(details.file) }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
