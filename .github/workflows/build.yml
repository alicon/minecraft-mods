name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft-version: '1.21.11'
            gradle-tasks: build
          - minecraft-version: '1.21.1'
            gradle-tasks: ':narwhal-together:build :mushroom-the-yorkie:build'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew ${{ matrix.gradle-tasks }} -Ptarget_minecraft_version=${{ matrix.minecraft-version }} --no-daemon

      - name: Upload mod JARs
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-mods-${{ matrix.minecraft-version }}
          path: |
            build/mods/*/${{ matrix.minecraft-version }}/libs/*.jar
            !build/mods/*/${{ matrix.minecraft-version }}/libs/*-sources.jar
          if-no-files-found: error
