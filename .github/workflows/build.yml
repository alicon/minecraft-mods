name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      play_seconds:
        description: Seconds of autonomous Mushroom play
        type: choice
        options: ['1800', '7200', '14400']
        default: '1800'
      play_seed:
        description: Integer gameplay seed
        type: string
        default: '119'

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check harness syntax and regression tests
        run: |
          npm --prefix tools/playtest-harness run check
          npm --prefix tools/playtest-harness test
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check scripts against the stable Bedrock API
        run: |
          npm --prefix tools/bedrock ci
          npm --prefix tools/bedrock run check

  bedrock-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 260 || 20 }}
    env:
      PLAY_SECONDS: ${{ inputs.play_seconds || '30' }}
      PLAY_SEED: ${{ inputs.play_seed || '119' }}
    steps:
      - uses: actions/checkout@v7
      - name: Download Bedrock Dedicated Server 26.66.1
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            --user-agent 'Mozilla/5.0' \
            https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-1.26.66.1.zip \
            --output "$RUNNER_TEMP/bedrock-server.zip"
          echo "e87bcd95bec5cc34b065ca956825c6abb7a0c356ae79408302845069cecaa6bf  $RUNNER_TEMP/bedrock-server.zip" | sha256sum --check
      - name: Exercise each add-on with the other two installed
        run: |
          server="$RUNNER_TEMP/bedrock-server.zip"
          mushroom="$(python3 scripts/build-bedrock-addon.py mushroom-the-yorkie)"
          cops="$(python3 scripts/build-bedrock-addon.py cops-and-robbers)"
          narwhal="$(python3 scripts/build-bedrock-addon.py narwhal-together)"
          set -o pipefail
          python3 -u scripts/smoke-mushroom-bedrock.py "$server" "$mushroom" \
            --with-addon "$cops" --with-addon "$narwhal" \
            --verify-care-persistence --verify-fetch --verify-adoption --verify-flight \
            --play-seconds "$PLAY_SECONDS" --play-seed "$PLAY_SEED" 2>&1 | tee build/bedrock/mushroom-play.log
          python3 scripts/smoke-cops-bedrock.py "$server" "$cops" \
            --with-addon "$mushroom" --with-addon "$narwhal" \
            --verify-vehicles --verify-patrol --verify-fire --verify-jail
          python3 scripts/smoke-narwhal-bedrock.py "$server" "$narwhal" \
            --with-addon "$mushroom" --with-addon "$cops"

      - name: Keep Mushroom gameplay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mushroom-gameplay-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/bedrock/mushroom-play.log
          if-no-files-found: warn
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft-version: '1.21.11'
            gradle-tasks: build
          - minecraft-version: '1.21.1'
            gradle-tasks: 'check :narwhal-together:build :mushroom-the-yorkie:build'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew ${{ matrix.gradle-tasks }} -Ptarget_minecraft_version=${{ matrix.minecraft-version }} --no-daemon

      - name: Upload mod JARs
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-mods-${{ matrix.minecraft-version }}
          path: |
            build/mods/*/${{ matrix.minecraft-version }}/libs/*.jar
            !build/mods/*/${{ matrix.minecraft-version }}/libs/*-sources.jar
          if-no-files-found: error
